services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: painel
      POSTGRES_PASSWORD: painel
      POSTGRES_DB: painel
    ports:
      - '25432:5432'
    volumes:
      - painel-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U painel']
      interval: 3s
      retries: 10
volumes:
  painel-db:
